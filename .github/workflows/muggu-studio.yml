name: Muggu Studio Flutter CI

on:
  push:
    paths:
      - app-muggu-studio/**
      - .github/workflows/muggu-studio.yml
  pull_request:
    paths:
      - app-muggu-studio/**
      - .github/workflows/muggu-studio.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-muggu-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install catalog generator dependency
        run: python -m pip install -r tools/requirements.txt
      - name: Test catalog generator
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check generated catalog
        run: python tools/generate_sample_catalog.py --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-x64
